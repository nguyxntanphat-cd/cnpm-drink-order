name: CI

# Quality gate theo Assignment 2 (Task 4.4): Install → Lint → Unit Test → Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test?schema=public
      JWT_SECRET: ci-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Test
        run: npm test -- --passWithNoTests
      - name: Build
        run: npm run build
      - name: Migrate DB (cho e2e)
        run: npx prisma migrate deploy
      - name: E2E Test (API)
        run: npm run test:e2e

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Test
        run: npm test --if-present
      - name: Build
        run: npm run build

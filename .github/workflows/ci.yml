name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewlite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test?schema=public
      JWT_SECRET: ci-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - id: check
        working-directory: .
        run: echo "exists=$([ -f backend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        run: npm ci
      - if: steps.check.outputs.exists == 'true' && hashFiles('backend/prisma/schema.prisma') != ''
        run: npx prisma generate && npx prisma migrate deploy
      - if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present
      - if: steps.check.outputs.exists == 'true'
        run: npm run build
      - if: steps.check.outputs.exists == 'true'
        run: npm test --if-present -- --passWithNoTests
      - if: steps.check.outputs.exists == 'true'
        run: npm run test:e2e --if-present
      - if: steps.check.outputs.exists != 'true'
        run: echo "backend chưa được khởi tạo (xem issue 11), bỏ qua"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - id: check
        working-directory: .
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        run: npm ci
      - if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present
      - if: steps.check.outputs.exists == 'true'
        run: npm run build
      - if: steps.check.outputs.exists == 'true'
        run: npm test --if-present
      - if: steps.check.outputs.exists != 'true'
        run: echo "frontend chưa được khởi tạo (xem issue 12), bỏ qua"

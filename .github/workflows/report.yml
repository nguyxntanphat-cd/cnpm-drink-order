name: Report

# Build báo cáo LaTeX: 7 file PDF (bìa từng thành viên) → tab Actions → Report → Artifacts
on:
  push:
    branches: [main]
    paths: ['report/**', '.github/workflows/report.yml']
  pull_request:
    paths: ['report/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài XeLaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended fonts-texgyre latexmk
      - name: Build 7 bản báo cáo
        run: ./report/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BrewLite-bao-cao
          path: report/out/*.pdf
